<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — AI Agent SaaS</title>
    <script src="assets/js/light.js"></script>
    <link rel="stylesheet" href="assets/css/common.css">
    <style>
        .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-primary); padding:20px; position:relative; overflow:hidden; }
        .auth-page::before { content:''; position:absolute; top:-30%; right:-20%; width:600px; height:600px; background:radial-gradient(circle, rgba(239,68,68,.06) 0%, transparent 70%); border-radius:50%; }
        .auth-card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-xl); padding:40px; width:100%; max-width:420px; position:relative; z-index:1; box-shadow:var(--shadow-lg); }
        .auth-brand { text-align:center; margin-bottom:32px; }
        .auth-brand .logo { width:56px; height:56px; background:linear-gradient(135deg,#ef4444,#dc2626); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:14px; box-shadow:0 8px 30px rgba(239,68,68,.25); }
        .auth-brand h1 { font-size:22px; font-weight:800; margin-bottom:4px; }
        .auth-brand p { color:var(--text-muted); font-size:13.5px; }
        .auth-footer { text-align:center; margin-top:24px; font-size:13px; color:var(--text-muted); }
        .form-group .form-control { padding:12px 16px; }
    </style>
    <link rel="stylesheet" href="assets/css/light.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="logo">🔑</div>
                <h1>Forgot Password?</h1>
                <p>Enter your email and we'll send you a reset link</p>
            </div>

                        
            <form method="POST" action="#" data-clone-action="https://agent.insafboost.com/forgot-password">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" value="" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;">📧 Send Reset Link</button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>
<script src="assets/js/supabase.min.js"></script>
<script src="assets/js/auth-app.js"></script>
</body>
</html>
